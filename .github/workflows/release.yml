name: Build multi-platform release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm test

      - name: Build Windows portable app
        run: npm run pack
      - name: Upload shared web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-latest/*.exe
          if-no-files-found: error

  macos:
    needs: windows
    # macos-15-intel is the stable hosted Intel runner. The x64 app runs on both
    # Intel and Apple Silicon through Rosetta while native arm64 packaging is
    # added as a separate follow-up once the hosted arm64 runner is stable.
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download shared web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Verify
        run: npm test
      - name: Build macOS Intel ZIP
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --config electron-builder.config.cjs --mac --x64 2>&1 | tee mac-build.log
      - name: Upload macOS build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: mac-build.log
          if-no-files-found: warn
      - name: Expose macOS build error
        if: failure()
        shell: bash
        run: |
          tail -n 10 mac-build.log | while IFS= read -r line; do
            echo "::error::$line"
          done < mac-build.log
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: |
            release-latest/*.zip
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
